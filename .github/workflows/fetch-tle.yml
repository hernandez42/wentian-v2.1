name: fetch-tle
#每日代取 Celestrak TLE → 提交到仓库
# 原因: 问天AGX 本机到 celestrak.org / workers.dev 的 443 出站被封,
#       DNS 亦被污染。GitHub Actions 出口不受影响。
on:
  schedule:
    - cron: '17 3,9,15,21 * * *'   # 每日4 次, 间隔 6h (Celestrak 限流: 每 2h 最多 1 次)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch TLE from Celestrak
        env:
          GROUP: beidou
        run: |
          set -euo pipefail
          mkdir -p tle
          for g in beidou gps galileo; do
            echo "fetching $g ..."
            curl -fsSL --max-time 60 --retry 2 --retry-delay 3 \
              "https://celestrak.org/NORAD/elements/gp.php?GROUP=$g&FORMAT=tle" \
              -o "tle/$g.tle" || { echo "  FAIL $g"; continue; }
            # 校验 3LE: 1 行与 2 行数必须相等且非零
            n1=$(grep -c '^1 ' "tle/$g.tle" || true)
            n2=$(grep -c '^2 ' "tle/$g.tle" || true)
            if [ "$n1" -eq 0 ] || [ "$n1" != "$n2" ]; then
              echo "  INVALID $g (1行=$n1 2行=$n2), 保留旧文件"
              git checkout -- "tle/$g.tle" 2>/dev/null || rm -f "tle/$g.tle"
            else
              echo "  OK $g: $n1 satellites"
            fi
            sleep 5
          done

      - name: Commit if changed
        run: |
          git config user.name  "wentian-tle-bot"
          git config user.email "tle-bot@users.noreply.github.com"
          git add tle/
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore(tle): daily refresh from Celestrak $(date -u +%FT%TZ)"
            git push
          fi
